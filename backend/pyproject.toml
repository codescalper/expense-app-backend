[project]
name = "family-budget-backend"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
description = "Family Budget & Expense API (FastAPI + PostgreSQL)"
# Vercel installs from pyproject.toml when one exists (it ignores requirements.txt then), so the
# runtime dependencies are mirrored here: the top-level requirements.in packages at the versions
# pinned in requirements.txt, with every transitive pin as a uv constraint below. Docker still
# installs requirements.txt. tests/test_vercel.py fails if the two drift apart.
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0",
  "pydantic[email]==2.14.4",
  "pydantic-settings==2.16.3",
  "sqlalchemy[asyncio]==2.1.9",
  "asyncpg==0.32.0",
  "alembic==1.20.1",
  "argon2-cffi==25.1.0",
  "pyjwt==2.15.1",
  "structlog==26.1.0",
  "python-multipart==0.0.34",
  "pillow==13.0.0",
  "httpx==0.28.1",
  "python-dateutil==4.0.0",
  "aiosmtplib==5.1.3",
  "tzdata==2026.6",
]

[tool.vercel]
# Deployed as one Vercel Function; its vercel.json "functions" key is "app/main.py".
entrypoint = "app.main:app"

[tool.uv]
constraint-dependencies = [
  "aiosmtplib==5.1.3",
  "alembic==1.20.1",
  "annotated-doc==0.0.7",
  "annotated-types==0.8.0",
  "anyio==4.16.0",
  "argon2-cffi==25.1.0",
  "argon2-cffi-bindings==26.2.0",
  "asyncpg==0.32.0",
  "certifi==2026.10.23",
  "cffi==2.1.1",
  "click==8.5.1",
  "dnspython==2.9.2",
  "email-validator==2.4.0",
  "fastapi==0.165.0",
  "greenlet==3.5.6",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httptools==0.9.0",
  "httpx==0.28.1",
  "idna==3.20",
  "mako==1.4.3",
  "markupsafe==3.0.4",
  "opentelemetry-api==1.45.2",
  "pillow==13.0.0",
  "pycparser==3.12",
  "pydantic==2.14.4",
  "pydantic-core==2.50.5",
  "pydantic-settings==2.16.3",
  "pyjwt==2.15.1",
  "python-dateutil==4.0.0",
  "python-dotenv==1.2.4",
  "python-multipart==0.0.34",
  "pyyaml==6.0.3",
  "sqlalchemy==2.1.9",
  "starlette==1.10.0",
  "structlog==26.1.0",
  "typing-extensions==4.16.0",
  "typing-inspection==0.4.5",
  "tzdata==2026.6",
  "uvicorn==0.54.0",
  "watchfiles==1.3.0",
  "websockets==17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = [
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "RUF012", # mutable class attrs used for SQLAlchemy __table_args__
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
